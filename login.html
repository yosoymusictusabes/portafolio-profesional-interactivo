<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Portafolio Profesional</title>
    <link rel="stylesheet" href="/styles/global.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            background-color: var(--color-bg);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-lg);
            padding: var(--spacing-2xl);
            width: 100%;
            max-width: 450px;
        }

        .login-header {
            text-align: center;
            margin-bottom: var(--spacing-xl);
        }

        .login-header h1 {
            color: var(--color-primary);
            margin-bottom: var(--spacing-sm);
        }

        .login-header p {
            color: var(--color-text-light);
            margin: 0;
        }

        .login-form {
            margin-bottom: var(--spacing-lg);
        }

        .alert {
            padding: var(--spacing-md);
            border-radius: var(--radius-md);
            margin-bottom: var(--spacing-lg);
        }

        .alert-error {
            background-color: #fee;
            color: var(--color-error);
            border: 1px solid var(--color-error);
        }

        .alert-info {
            background-color: #e0f2fe;
            color: #0369a1;
            border: 1px solid #0369a1;
        }

        .demo-users {
            background-color: var(--color-bg-gray);
            border-radius: var(--radius-md);
            padding: var(--spacing-lg);
            margin-top: var(--spacing-xl);
        }

        .demo-users h3 {
            font-size: var(--font-size-base);
            margin-bottom: var(--spacing-md);
            color: var(--color-text);
        }

        .demo-user {
            display: flex;
            justify-content: space-between;
            padding: var(--spacing-sm) 0;
            border-bottom: 1px solid var(--color-border);
            font-size: var(--font-size-sm);
        }

        .demo-user:last-child {
            border-bottom: none;
        }

        .demo-user-info {
            color: var(--color-text);
        }

        .demo-user-credentials {
            color: var(--color-text-light);
            font-family: monospace;
        }

        .back-link {
            text-align: center;
            margin-top: var(--spacing-lg);
        }

        .back-link a {
            color: var(--color-primary);
            text-decoration: none;
        }

        .back-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>Iniciar Sesión</h1>
            <p>Accede a los sistemas CRM y Logística</p>
        </div>

        <div id="alert-container"></div>

        <form id="login-form" class="login-form">
            <div class="form-group">
                <label for="usuario">Usuario</label>
                <input 
                    type="text" 
                    id="usuario" 
                    name="usuario" 
                    class="form-control" 
                    placeholder="Ingrese su usuario"
                    required
                    autocomplete="username"
                >
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    class="form-control" 
                    placeholder="Ingrese su contraseña"
                    required
                    autocomplete="current-password"
                >
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%;">
                Iniciar Sesión
            </button>
        </form>

        <div class="demo-users">
            <h3>👤 Usuarios de Prueba</h3>
            <div class="demo-user">
                <span class="demo-user-info">
                    <strong>Admin</strong> - Acceso completo
                </span>
                <span class="demo-user-credentials">admin / admin123</span>
            </div>
            <div class="demo-user">
                <span class="demo-user-info">
                    <strong>Cliente</strong> - Acceso limitado
                </span>
                <span class="demo-user-credentials">cliente1 / cliente123</span>
            </div>
            <div class="demo-user">
                <span class="demo-user-info">
                    <strong>Público</strong> - Solo lectura
                </span>
                <span class="demo-user-credentials">publico / publico123</span>
            </div>
        </div>

        <div class="back-link">
            <a href="/">← Volver al portafolio</a>
        </div>
    </div>

    <script type="module">
        import { AuthService } from '/shared/auth/auth.service.js';
        import { app } from '/shared/core/app.js';

        // Inicializar app
        await app.inicializar();

        const authService = new AuthService();
        const form = document.getElementById('login-form');
        const alertContainer = document.getElementById('alert-container');

        // Si ya hay sesión activa, redirigir
        if (authService.validarSesion()) {
            window.location.href = '/projects/crm-system/index.html';
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const usuario = document.getElementById('usuario').value;
            const password = document.getElementById('password').value;

            try {
                // Limpiar alertas
                alertContainer.innerHTML = '';

                // Deshabilitar botón
                const btnSubmit = form.querySelector('button[type="submit"]');
                btnSubmit.disabled = true;
                btnSubmit.textContent = 'Iniciando sesión...';

                // Intentar login
                const usuarioAutenticado = authService.login(usuario, password);

                // Mostrar mensaje de éxito
                mostrarAlerta('success', `Bienvenido ${usuarioAutenticado.nombre}!`);

                // Redirigir según parámetro o a CRM por defecto
                const urlParams = new URLSearchParams(window.location.search);
                const redirect = urlParams.get('redirect') || '/projects/crm-system/index.html';
                
                setTimeout(() => {
                    window.location.href = redirect;
                }, 1000);

            } catch (error) {
                console.error('Error en login:', error);
                mostrarAlerta('error', error.message);
                
                // Rehabilitar botón
                const btnSubmit = form.querySelector('button[type="submit"]');
                btnSubmit.disabled = false;
                btnSubmit.textContent = 'Iniciar Sesión';
            }
        });

        function mostrarAlerta(tipo, mensaje) {
            const alert = document.createElement('div');
            alert.className = `alert alert-${tipo}`;
            alert.textContent = mensaje;
            alertContainer.appendChild(alert);
        }
    </script>
</body>
</html>
